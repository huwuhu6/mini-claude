name: 离线单元与跨平台 Runtime 回归
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DASHSCOPE_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - name: 确认参考变体验证所需工具存在
        run: python -c "import subprocess; subprocess.run(['node','--version'],check=True); subprocess.run(['javac','-version'],check=True)"
      - run: python -m pytest tests/unit -q
      - run: python -m pytest tests/integration/test_cli_input.py tests/integration/test_loop_controller.py -q
      - name: 确认测试未修改已跟踪内容
        run: git diff --exit-code
