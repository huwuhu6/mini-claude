# Agent Configuration
agent:
  name: "mini-claude"
  version: "1.0.0"

# LLM Provider Configuration
llm:
  provider: "dashscope"  # Alibaba Cloud Bailian / DashScope
  model: "deepseek-v4-flash-0731"
  max_tokens: 8192
  temperature: 0.7
  timeout_ms: 60000
  stream: true
  # Effective choices from lowest to highest; only for this deployment.
  reasoning_effort: high
  supported_reasoning_efforts: [low, high, max]
  output_limit_recovery:
    enabled: true
    persist_effort_for_run: true
    max_retries_per_turn: 2
    max_retries_per_run: 4
    max_output_tokens: 32768
    # Conservative reservation: estimated input + full output for extra requests.
    max_retry_tokens_per_run: 262144
    context_safety_margin_tokens: 2048

  # Deepseek configuration
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"

  # Anthropic configuration
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "${ANTHROPIC_BASE_URL}"

  # DashScope compatible-mode configuration
  dashscope:
    api_key: "${DASHSCOPE_API_KEY}"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Feature Configuration
features:
  subagent: true
  # features.tasks/team are reserved/dormant multi-agent infrastructure;
  # neither is an active runtime feature.
  tasks: false
  compression: true
  background: true
  team: false
  skills: true
  memory: true

# Task Management
tasks:
  directory: ".tasks"
  auto_claim: true
  poll_interval: 5

# Team Configuration
team:
  directory: ".team"
  idle_timeout: 60
  auto_claim_tasks: true

# Compression Settings
compression:
  context_window_tokens: 1000000
  microcompact_token_threshold: 250000
  full_compression_token_threshold: 500000
  max_transcripts: 100

# Background Processing
background:
  max_concurrent: 5
  default_timeout: 120
  notification_queue_size: 1000

# Skills Configuration
skills:
  directory: "skills"

# Logging
logging:
  level: "INFO"
  file: "logs/agent.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
